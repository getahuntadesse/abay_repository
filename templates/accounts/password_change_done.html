{% extends 'base.html' %}

{% block title %}Password Changed - Abay Repository{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm text-center">
                <div class="card-body py-5">
                    <i class="fas fa-check-circle fa-4x mb-3" style="color: #28a745;"></i>
                    <h4>Password updated</h4>
                    <p class="text-muted">Your password has been changed successfully.</p>
                    <a href="{% url 'accounts:dashboard_redirect' %}" class="btn btn-gold mt-2">
                        <i class="fas fa-tachometer-alt me-2"></i>Back to Dashboard
                    </a>
                    <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary mt-2">
                        Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .btn-gold {
        background: linear-gradient(135deg, #DAA520, #B8860B);
        color: #1A1A1A;
        border: none;
        font-weight: 600;
        padding: 10px 24px;
        border-radius: 8px;
    }
</style>
{% endblock %}
