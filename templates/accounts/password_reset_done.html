{% extends "base.html" %}
{% block title %}Check your email - Abay Repository{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0" style="border-radius:12px;">
        <div class="card-body p-4">
          <h4 class="mb-3" style="color:#B8860B;"><i class="fas fa-key me-2"></i>Check your email</h4>
          
<p>If an account exists for that email, a password reset link has been sent.</p>
<p>Please check your inbox and spam folder.</p>
<p class="mt-3"><a href="{% url 'accounts:login' %}">Back to login</a></p>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
