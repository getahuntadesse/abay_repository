{% extends "base.html" %}
{% block title %}Reset Password - Abay Repository{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0" style="border-radius:12px;">
        <div class="card-body p-4">
          <h4 class="mb-3" style="color:#B8860B;"><i class="fas fa-key me-2"></i>Reset Password</h4>
          
<p class="text-muted">Enter the email address on your account. We will send a reset link.</p>
<form method="post">{% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" required placeholder="you@example.com" autocomplete="email">
  </div>
  <button type="submit" class="btn w-100" style="background:#DAA520;font-weight:600;">Send reset link</button>
</form>
<p class="mt-3 text-center"><a href="{% url 'accounts:login' %}">Back to login</a></p>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
