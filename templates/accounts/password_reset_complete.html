{% extends "base.html" %}
{% block title %}Password changed - Abay Repository{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0" style="border-radius:12px;">
        <div class="card-body p-4">
          <h4 class="mb-3" style="color:#B8860B;"><i class="fas fa-key me-2"></i>Password changed</h4>
          
<p class="text-success">Your password has been set. You can log in now.</p>
<p><a class="btn" style="background:#DAA520;font-weight:600;" href="{% url 'accounts:login' %}">Log in</a></p>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
