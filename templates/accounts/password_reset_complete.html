{% extends 'base.html' %}

{% block title %}Password Reset Complete - Abay Repository{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white border-0 py-3">
                    <h4 class="mb-0">
                        <i class="fas fa-check-circle me-2" style="color: #28a745;"></i>
                        Password Reset Complete
                    </h4>
                </div>
                <div class="card-body text-center py-4">
                    <i class="fas fa-check-circle fa-4x mb-3" style="color: #28a745;"></i>
                    <h5>Password Reset Successful!</h5>
                    <p class="text-muted">Your password has been set. You may now log in with your new password.</p>
                    <hr>
                    <a href="{% url 'accounts:login' %}" class="btn btn-gold">
                        <i class="fas fa-sign-in-alt me-2"></i>Login Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .btn-gold {
        background: linear-gradient(135deg, #DAA520, #B8860B);
        color: #1A1A1A;
        border: none;
        font-weight: 600;
        padding: 10px 24px;
        border-radius: 8px;
        transition: all 0.3s ease;
    }
    .btn-gold:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(218, 165, 32, 0.4);
        color: #1A1A1A;
    }
    .card {
        border-radius: 12px;
        border: none;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }
    .card-header {
        border-radius: 12px 12px 0 0 !important;
    }
</style>
{% endblock %}
