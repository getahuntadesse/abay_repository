{% extends "base.html" %}
{% block title %}Disable 2FA{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm" style="border-radius:12px;">
        <div class="card-body p-4">
          <h4 style="color:#B8860B;">Disable two-factor authentication</h4>
          <p class="text-muted">Enter your password to confirm.</p>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Current password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">Disable 2FA</button>
          </form>
          <a href="{% url 'accounts:setup_2fa' %}" class="small d-block mt-3">Cancel</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
