{% extends "base.html" %}
{% block title %}Change password - Abay Repository{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0" style="border-radius:12px;">
        <div class="card-body p-4">
          <h4 class="mb-3" style="color:#B8860B;"><i class="fas fa-key me-2"></i>Change password</h4>
          
<p class="text-muted">Change the password for your Abay account (all dashboards).</p>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn w-100" style="background:#DAA520;font-weight:600;">Update password</button>
</form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
