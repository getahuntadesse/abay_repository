{% for book in books %}
<div class="search-result-item p-2 border-bottom">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <a href="{% url 'books:detail' book.id %}" class="text-dark text-decoration-none">
                <strong>{{ book.title }}</strong>
            </a>
            <br>
            <small class="text-muted">by {{ book.author.display_name|default:"Unknown" }}</small>
        </div>
        <div>
            {% if book.is_free %}
                <span class="badge bg-success">FREE</span>
            {% else %}
                <span class="badge" style="background: #DAA520;">{{ book.price }} ETB</span>
            {% endif %}
        </div>
    </div>
</div>
{% empty %}
<div class="text-center py-3">
    <i class="fas fa-search fa-2x text-muted mb-2"></i>
    <p class="text-muted">No books found</p>
</div>
{% endfor %}
