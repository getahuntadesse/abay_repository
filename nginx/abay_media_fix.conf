# nginx snippet — CRITICAL for production
# The live site currently serves /media/ directly from disk, bypassing Django.
# That is why SVG XSS and paywall-bypass PDFs are still reachable.
#
# Place this inside the server { } block for abay.abrehot.org.et
# and reload nginx:  sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# NEVER serve media as static files. Proxy every /media/ request to Django
# so secure_media_serve can enforce auth + block SVG/HTML.
# ---------------------------------------------------------------------------

location /media/ {
    # Do not use alias / root for book manuscripts
    proxy_pass http://127.0.0.1:8000;   # or your gunicorn/uwsgi upstream
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Optional: if you later use X-Accel-Redirect for performance,
    # keep Django as the gatekeeper that decides whether to issue the header.
    # internal;
}

# Explicitly deny directory listing
location ~ ^/media/.*/$ {
    return 403;
}

# Extra safety: block known dangerous extensions at nginx level too
location ~* ^/media/.*\.(svg|svgz|html?|xhtml|php|phtml|js|mjs|exe|sh|bat)$ {
    return 403;
}

# Static assets (CSS/JS/images that are NOT user uploads) can stay public
location /static/ {
    alias /path/to/your/staticfiles/;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff;
}
