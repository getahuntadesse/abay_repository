# nginx — CRITICAL for production
# Without this, nginx serves /media/ from disk and bypasses Django authorization.
# Add inside the server { } block for abay.abrehot.org.et, then:
#   sudo nginx -t && sudo systemctl reload nginx

# Proxy ALL /media/ requests to Django (secure_media_serve)
location /media/ {
    proxy_pass http://127.0.0.1:8000;   # change if gunicorn/uwsgi is elsewhere
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Deny directory listing
location ~ ^/media/.*/$ {
    return 403;
}

# Extra deny of dangerous extensions at nginx layer
location ~* ^/media/.*\.(svg|svgz|html?|xhtml|php|phtml|js|mjs|exe|sh|bat)$ {
    return 403;
}

# Public static (non-user-upload) assets
location /static/ {
    alias /path/to/your/staticfiles/;   # adjust path
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff;
}
